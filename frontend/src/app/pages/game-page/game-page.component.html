<pac-brand-header />

<main class="game-page">
  @if (selfSummary()) {
    <h1>{{ selfSummary() }}</h1>
  } @else {
    <h1>PacMacro</h1>
  }

  <div class="game-page__status" role="status" aria-live="polite">
    <p>{{ pageStatus() }}</p>
    <p>{{ socket.status() }}</p>
    <p>{{ geolocation.status() }}</p>
  </div>

  <label
    class="game-page__wake-lock"
    [class.game-page__wake-lock--disabled]="!wakeLock.supported()"
  >
    <input
      type="checkbox"
      [checked]="wakeLock.enabled()"
      [disabled]="!wakeLock.supported()"
      (change)="toggleWakeLock($event)"
    />
    Keep screen awake
  </label>
  <p class="game-page__wake-status">{{ wakeLock.status() }}</p>

  <div class="game-page__layout" [class.game-page__layout--with-panel]="isLeader()">
    @if (map(); as gameMap) {
      <div class="game-page__map">
        <pac-game-canvas
          class="game-page__canvas"
          [map]="gameMap"
          [players]="socket.players()"
          [selfId]="selfId()"
          [isFlagFound]="socket.isFlagFound()"
        />
        <pac-game-timer [state]="socket.gameState()" [overlay]="true" />
      </div>
    }

    <pac-leader-overlay class="game-page__panel" [active]="isLeader()" />
  </div>
</main>

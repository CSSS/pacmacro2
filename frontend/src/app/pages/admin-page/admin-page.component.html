<main class="admin-page">
  <header>
    <p class="eyebrow">PacMacro control panel</p>
    <h1>Admin</h1>
  </header>

  <p class="admin-connection-status" role="status">{{ connectionStatus() }}</p>
  <p class="admin-status" role="status" aria-live="polite">{{ status() }}</p>

  <section class="admin-actions" aria-label="Bulk player actions">
    <button type="button" [disabled]="!hasConnectedPlayers()" (click)="makeGhostsEdible()">
      Make Ghosts Edible
    </button>
    <button type="button" [disabled]="!hasConnectedPlayers()" (click)="makeAllNothing()">
      Make All Nothing
    </button>
  </section>

  <section class="player-list" aria-label="Players">
    @for (player of players(); track player.id) {
      <article
        class="player-card"
        [class.player-card--hidden]="player.type === PlayerType.Hidden"
        [class.player-card--offline]="!isConnected(player)"
      >
        <div class="player-card__identity">
          <strong>{{ player.name }}</strong>
          <span>{{ player.id }}</span>
          <span class="player-card__status">
            {{ isConnected(player) ? 'Connected' : 'Offline' }}
          </span>
        </div>

        <label>
          Type
          <select
            [ngModel]="player.type"
            (ngModelChange)="setType(player.id, $event)"
            [name]="'type-' + player.id"
            [disabled]="!isConnected(player)"
          >
            @for (type of playerTypes; track type.value) {
              <option [ngValue]="type.value">{{ type.label }}</option>
            }
          </select>
        </label>

        <label>
          Representation
          <select
            [ngModel]="player.reps"
            (ngModelChange)="setRepresentation(player.id, $event)"
            [name]="'reps-' + player.id"
            [disabled]="!isConnected(player)"
          >
            @for (representation of representations; track representation.value) {
              <option [ngValue]="representation.value">{{ representation.label }}</option>
            }
          </select>
        </label>

        <button type="button" [disabled]="!isConnected(player)" (click)="updatePlayer(player)">
          Update {{ player.id }}
        </button>
      </article>
    } @empty {
      <p class="player-list__empty">Players will appear here when they register.</p>
    }
  </section>
</main>
